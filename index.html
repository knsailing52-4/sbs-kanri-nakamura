<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>案件管理ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-title">
        <span class="logo">📋 案件管理</span>
        <div class="branch-switcher">
          <label class="branch-label">支店：</label>
          <select id="branchSelect" class="branch-select">
            <option value="nagoya">名古屋支店</option>
            <option value="sapporo">札幌支店</option>
            <option value="sendai">仙台支店</option>
          </select>
        </div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <a href="list.html" class="btn-list-view" id="listViewBtn">📊 一覧表示</a>
        <button class="btn-add-main" onclick="openAddModal()">＋ 新規案件登録</button>
      </div>
    </div>
  </header>

  <!-- 工程一覧バー -->
  <div class="task-list-bar">
    <div class="task-list-inner">
      <span class="task-list-title">工程</span>
      <span class="task-item">01 商談中</span><span class="task-sep">→</span>
      <span class="task-item">02 概算見積提出</span><span class="task-sep">→</span>
      <span class="task-item">03 導入環境確認</span><span class="task-sep">→</span>
      <span class="task-item">04 仕入れ見積取得</span><span class="task-sep">→</span>
      <span class="task-item">05 最終見積提出</span><span class="task-sep">→</span>
      <span class="task-item">06 CS打合せ</span><span class="task-sep">→</span>
      <span class="task-item">07 受注</span><span class="task-sep">→</span>
      <span class="task-item">08 社内キックオフ</span><span class="task-sep">→</span>
      <span class="task-item">09 システム構築準備</span><span class="task-sep">→</span>
      <span class="task-item">10 稼働</span><span class="task-sep">→</span>
      <span class="task-item">11 稼働後フォロー</span>
    </div>
  </div>

  <!-- 統計バー -->
  <div class="stats-bar">
    <div class="stats-inner">
      <div class="stat-item total">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">件（全体）</span>
      </div>
      <div class="stat-div"></div>
      <div class="stat-item delay">
        <span class="stat-num" id="statDelay">0</span>
        <span class="stat-label">件 遅延</span>
      </div>
      <div class="stat-item warning">
        <span class="stat-num" id="statWarning">0</span>
        <span class="stat-label">件 注意</span>
      </div>
      <div class="stat-item done">
        <span class="stat-num" id="statCompleted">0</span>
        <span class="stat-label">件 完了</span>
      </div>
    </div>
  </div>

  <!-- 検索・フィルタバー -->
  <div class="search-bar">
    <div class="search-inner">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="病院名で検索..." />
      </div>
      <select id="staffFilter" class="filter-select">
        <option value="">全員表示</option>
      </select>
      <span class="count-label"><span id="projectCount">0 件</span>表示中</span>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="project-grid" id="projectList"></div>
    <div class="empty-state" id="emptyState">
      <span class="empty-icon">📂</span>
      <p>案件が見つかりません</p>
      <p style="font-size:12px; color:#9aa5b4">「新規案件登録」から追加してください</p>
    </div>
  </main>

  <!-- 案件追加・編集モーダル -->
  <div id="projectModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">新規案件登録</h2>
        <button class="btn-modal-close" onclick="closeModal()">✕</button>
      </div>
      <form id="projectForm">
        <div class="modal-body">
          <input type="hidden" id="editProjectId" />

          <div class="form-section-title">基本情報</div>
          <div class="form-group">
            <label class="form-label" for="formHospitalName">病院名<span class="required">*</span></label>
            <input type="text" id="formHospitalName" class="form-input" placeholder="例：○○総合病院" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="formGoLiveDate">稼働予定日</label>
            <input type="date" id="formGoLiveDate" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formMainPerson">メイン担当</label>
            <select id="formMainPerson" class="form-select">
              <option value="">-- 選択してください --</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="formSubPerson">サブ担当</label>
            <select id="formSubPerson" class="form-select">
              <option value="">-- 選択してください --</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="formCurrentTask">現在のタスク</label>
            <select id="formCurrentTask" class="form-select"></select>
          </div>

          <div class="form-section-title">施設情報</div>
          <div class="form-group">
            <label class="form-label" for="formKeieiShukai">経営主体</label>
            <input type="text" id="formKeieiShukai" class="form-input" placeholder="例：市立" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formKyokaBedNum">許可病床数</label>
            <input type="text" id="formKyokaBedNum" class="form-input" placeholder="例：800床" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formByokoKosei">病棟構成</label>
            <input type="text" id="formByokoKosei" class="form-input" placeholder="例：急性期主体（ICU20床、HCU20床）" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formDonyuByoko">導入病棟</label>
            <input type="text" id="formDonyuByoko" class="form-input" placeholder="例：ICU、HCU、3A病棟" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formDonyuBedNum">導入病床数</label>
            <input type="text" id="formDonyuBedNum" class="form-input" placeholder="例：400床" />
          </div>

          <div class="form-section-title">機器情報</div>
          <div class="form-group">
            <label class="form-label" for="formBedsideTerminal">ベッドサイド端末（既存/新規台数）</label>
            <input type="text" id="formBedsideTerminal" class="form-input" placeholder="例：既存0台／新規400台" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formNemiriScan">眠りSCAN（既存/新規台数）</label>
            <input type="text" id="formNemiriScan" class="form-input" placeholder="例：既存0台／新規400台" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formRishoCatch">離床CATCH（既存/新規台数）</label>
            <input type="text" id="formRishoCatch" class="form-input" placeholder="例：既存30台／新規50台" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formWifiNav">Wi-Fiベッドナビ（既存/新規台数）</label>
            <input type="text" id="formWifiNav" class="form-input" placeholder="例：既存30台／新規50台" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formTabletPos">タブレット設置位置</label>
            <input type="text" id="formTabletPos" class="form-input" placeholder="例：床頭台前面" />
          </div>

          <div class="form-section-title">システム連携</div>
          <div class="form-group">
            <label class="form-label" for="formElectronicKarte">電子カルテ（ベンダー/機種）</label>
            <input type="text" id="formElectronicKarte" class="form-input" placeholder="例：富士通／HOPE LifeMark-HX" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formNurseCall">ナースコール（メーカー/機種）</label>
            <input type="text" id="formNurseCall" class="form-input" placeholder="例：ケアコム／PLAIMH-NICCS" />
          </div>
          <div class="form-group">
            <label class="form-label" for="formShuhenRenkei">周辺連携機能</label>
            <input type="text" id="formShuhenRenkei" class="form-input" placeholder="例：カメラ機能：あり、モバイル連携：なし" />
          </div>

          <div class="form-section-title">スケジュール</div>
          <div class="form-group">
            <label class="form-label" for="formScheduleStatus">スケジュール状況</label>
            <input type="text" id="formScheduleStatus" class="form-input" placeholder="例：電カル更新：2025/7、現状：約1か月遅延" />
          </div>

          <div class="form-section-title">備考</div>
          <div class="form-group">
            <label class="form-label" for="formMemo">備考</label>
            <textarea id="formMemo" class="form-textarea" placeholder="備考を入力してください"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal-box detail-modal-box">
      <div class="modal-header">
        <h2 id="detailTitle">施設詳細</h2>
        <button class="btn-modal-close" onclick="closeDetailModal()">✕</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeDetailModal()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 削除確認モーダル -->
  <div id="deleteModal" class="modal-overlay">
    <div class="modal-box delete-modal-box">
      <div class="modal-header">
        <h2>案件の削除</h2>
        <button class="btn-modal-close" onclick="closeDeleteModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="delete-info">⚠️ この操作は取り消せません。<br />削除パスワードを入力してください。</div>
        <div class="form-group">
          <label class="form-label" for="deletePassword">パスワード</label>
          <input type="password" id="deletePassword" class="form-input" placeholder="削除パスワードを入力" autocomplete="off" />
        </div>
        <div class="error-text" id="deleteError"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">キャンセル</button>
        <button class="btn btn-delete" onclick="confirmDelete()">削除する</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast"></div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
